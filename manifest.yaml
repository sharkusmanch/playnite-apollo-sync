AddonId: ApolloSync_f987343d-4168-4f44-9fb0-e3a21da314ad
Packages:
  - Version: 1.4.0
    RequiredApiVersion: 6.16.0
    ReleaseDate: 2026-07-29
    PackageUrl: https://github.com/sharkusmanch/playnite-apollo-sync/releases/download/v1.4.0/ApolloSync_v1.4.0.pext
    Changelog:
      - New - excluded filter presets. Games matching an excluded preset are never exported, even if they also match an included one, so you can keep mouse-only, VR or otherwise unstreamable games out without rebuilding your include presets
      - Pinned games that match an excluded preset are kept rather than auto-removed
      - Deleting an excluded preset in Playnite, or one that fails to evaluate, no longer silently re-exports the games it was suppressing
      - The filter preset lists are laid out in three columns so the included and excluded lists both fit on screen
      - Excluded filter presets contributed by @kinland
  - Version: 1.3.2
    RequiredApiVersion: 6.16.0
    ReleaseDate: 2026-07-28
    PackageUrl: https://github.com/sharkusmanch/playnite-apollo-sync/releases/download/v1.3.2/ApolloSync_v1.3.2.pext
    Changelog:
      - Cover art now appears in Moonlight for games whose Playnite cover is a JPEG saved under a .png name - those games previously showed no artwork at all
      - Covers are fitted to the 3:4 frame Moonlight expects instead of being stretched, so square and 2:3 artwork is no longer distorted
      - New setting to turn cover image export off entirely, leaving artwork you set yourself in Apollo/Sunshine untouched
      - Converted covers are now cached under %LOCALAPPDATA% instead of %TEMP%, where Windows disk cleanup could delete them and silently strip artwork from every exported game
      - A cover that fails to convert no longer clears artwork that was already exported for that game
      - "Note: Moonlight caches box art per app on the client, so after upgrading you may need to clear your client's cache or re-add the host before the corrected artwork appears"
  - Version: 1.3.1
    RequiredApiVersion: 6.16.0
    ReleaseDate: 2026-07-28
    PackageUrl: https://github.com/sharkusmanch/playnite-apollo-sync/releases/download/v1.3.1/ApolloSync_v1.3.1.pext
    Changelog:
      - Unchecking a filter preset now removes its games from apps.json on the next sync, instead of leaving them until something else happened to match
      - Deleting a filter preset in Playnite no longer causes every unpinned game to be removed
      - A failed apps.json write no longer leaves the plugin tracking games it did not export, which made them vanish from the managed games list until a restart
      - Games removed and re-added within the same sync are no longer left orphaned in apps.json
      - Editing filter presets while a sync is running no longer risks removing the games you were about to re-select
      - A filter that matches nothing now shows one notification instead of two contradictory ones
  - Version: 1.3.0
    RequiredApiVersion: 6.16.0
    ReleaseDate: 2026-07-26
    PackageUrl: https://github.com/sharkusmanch/playnite-apollo-sync/releases/download/v1.3.0/ApolloSync_v1.3.0.pext
    Changelog:
      - Security - the permission fix no longer grants all local users write access to apps.json; only your own account is granted access
      - apps.json writes are now atomic where possible and always keep a .bak of the previous contents
      - Failed apps.json writes are no longer reported as success, and no longer leave orphaned entries behind
      - Games you remove by hand stay removed - the manual removal is now recorded explicitly and survives a restart
      - Removing games from the settings tab now removes them from apps.json too, instead of orphaning the entries
      - A filter preset that fails to evaluate no longer causes every unpinned game to be removed
      - The managed games list in settings now populates when the tab is opened instead of requiring a manual Refresh
      - Removed the non-functional platform, label, completion status and category filter sections; use Playnite filter presets instead
  - Version: 1.2.1
    RequiredApiVersion: 6.16.0
    ReleaseDate: 2026-04-22
    PackageUrl: https://github.com/sharkusmanch/playnite-apollo-sync/releases/download/v1.2.1/ApolloSync_v1.2.1.pext
    Changelog:
      - Fix sync failure when AppsJsonPath setting is empty — permission-fix elevation now works from the default path\
      - Sunshine-only installs now update their existing apps.json instead of silently creating a new Apollo config
  - Version: 1.2.0
    RequiredApiVersion: 6.12.0
    ReleaseDate: 2026-04-13
    PackageUrl: https://github.com/sharkusmanch/playnite-apollo-sync/releases/download/v1.2.0/ApolloSync_v1.2.0.pext
    Changelog:
      - Fix apps.json sync reliability, stream lifetime tracking, and security hardening
  - Version: 1.1.0
    RequiredApiVersion: 6.12.0
    ReleaseDate: 2026-03-30
    PackageUrl: https://github.com/sharkusmanch/playnite-apollo-sync/releases/download/v1.1.0/ApolloSync_v1.1.0.pext
    Changelog:
      - Convert non-PNG cover images to PNG for Apollo compatibility
      - Auto-detect cover image changes and re-sync affected games
      - Run sync in background instead of blocking Playnite UI
      - Thread safety improvements for concurrent operations
  - Version: 1.0.1
