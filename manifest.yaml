  - Version: 1.0.0
    RequiredApiVersion: 6.12.0
    ReleaseDate: 2026-03-15
    PackageUrl: https://github.com/sharkusmanch/playnite-apollo-sync/releases/download/v1.0.0/ApolloSync_v1.0.0.pext
    Changelog:
      - Automatic sync on install, library update, settings change, or startup
      - Filter presets with OR logic, plus platform, label, category, and completion status filters
      - Pin/unpin games to prevent auto-removal
      - Manual export/remove via context menu
      - Manage exported games from settings tab
      - Configurable notification modes (always, on sync only, never)
